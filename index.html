<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSMX</title>
    <script>
    (function() {
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;

      // 1. ตรวจสอบ Android
      if (/android/i.test(userAgent)) {
        var rawUrl = window.location.href.replace(/^https?:\/\//, '');
        // บังคับเปิดด้วย Chrome บน Android
        window.location.href = "intent://" + rawUrl + "#Intent;scheme=https;package=com.android.chrome;end";
      } 
      // 2. ตรวจสอบ iOS (iPhone/iPad)
      else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        var isInApp = /LINE|FBAN|FBAV|Instagram|Twitter|TikTok/i.test(userAgent);
        
        // หากเปิดจากแอป LINE บน iOS บังคับเด้งออกไปเบราว์เซอร์หลัก
        if (/LINE/i.test(userAgent)) {
          var currentUrl = window.location.href;
          window.location.href = "line://app/openURL?url=" + encodeURIComponent(currentUrl);
        }
      }
    })();
    </script>
</head>
<body>
    <h2>กำลังนำท่านเข้าสู่ระบบ...</h2>
    <p>หากหน้าจอไม่เปลี่ยน กรุณากดเปิดในเบราว์เซอร์หลัก (Safari / Chrome)</p>
</body>
</html>
