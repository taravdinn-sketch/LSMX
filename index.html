<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSMX</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f8f9fa;
        }
        .btn-safari {
            display: inline-block;
            background-color: #007aff;
            color: white;
            padding: 15px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
    <script>
    (function() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      
      // 1. ถ้าเป็น Android บังคับเปิดด้วย Chrome
      if (/android/i.test(ua)) {
        var rawUrl = window.location.href.replace(/^https?:\/\//, '');
        window.location.href = "intent://" + rawUrl + "#Intent;scheme=https;package=com.android.chrome;end";
      } 
      // 2. ถ้าเป็น iOS (iPhone/iPad) ที่เปิดในแอป LINE / Facebook
      else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
        var isInApp = /LINE|FBAN|FBAV|Instagram|Twitter|TikTok/i.test(ua);
        if (isInApp) {
          // ใช้เทคนิคยิง Blob เพื่อให้ iOS ถามเปิดใน Safari (แก้ปัญหาขึ้น เกิดข้อผิดพลาดระบบ)
          try {
            var req = new XMLHttpRequest();
            req.open('GET', window.location.href, false);
            req.send();
          } catch(e) {}
        }
      }
    })();
    </script>
</head>
<body>
    <h2>กำลังนำท่านเข้าสู่ระบบ...</h2>
    <p>หากระบบไม่เปิดอัตโนมัติ กรุณากดปุ่มด้านล่าง หรือกด <b>"..."</b> มุมขวาบนแล้วเลือก <b>"เปิดใน Safari" (Open in Safari)</b></p>
    
    <a href="https://taravdinn-sketch.github.io/LSMX/" target="_blank" class="btn-safari">เข้าสู่เว็บไซต์</a>
</body>
</html>
